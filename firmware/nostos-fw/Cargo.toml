# Nostos PaperMono 受信ファーム（Phase 2 本実装）。
# 親ワークスペースからは exclude 済み（Xtensa ターゲットのため）。
# ビルドはこのディレクトリで `cargo +esp build --release`（.cargo/config.toml が
# target / build-std / linkall を供給）。詳細は README.md / docs/TOOLCHAIN.md。
[package]
name = "nostos-fw"
version = "0.1.0"
edition = "2021"
publish = false
description = "Nostos PaperMono 受信ファーム（SX1262 受信 → NostosFrame → Trail → e-ink 軌跡表示）"
license = "MIT"

# 独立ワークスペース（親の members/exclude と干渉させない）。
[workspace]

[dependencies]
# --- 言語非依存ロジック（本リポジトリの host crate をそのまま使う） ---
nostos-frame = { path = "../../crates/nostos-frame" }
nostos-nav = { path = "../../crates/nostos-nav" }

# --- papermono-rs BSP（MIT・path 依存。g:\dev\papermono-rs をローカル参照） ---
# ピン定義・SSD1677 OTP・M5PM1/M5IOE1・FT6336G 定義
m5stack-papermono-lite = { path = "../../../papermono-rs/crates/m5stack-papermono-lite" }
# SX1262 ドライバ＋LoRa 定数（C153 フル SKU）
m5stack-papermono = { path = "../../../papermono-rs/crates/m5stack-papermono" }

# --- esp-hal / embassy（papermono-rs embassy-debug と同 tag に揃える） ---
esp-hal = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
  "unstable",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", default-features = false, features = [
  "esp32s3",
  "jtag-serial",
  "critical-section",
] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "embassy",
  "esp32s3",
] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"

# --- 描画・ユーティリティ ---
embedded-graphics = "0.8.2"
static_cell = "2.1.1"
libm = "0.2"

# --- microSD ロガー（SDHOST + SD 初期化 + FAT・esp-hal qa-test と同構成） ---
sdio = "0.5"
block-device-adapters = "0.2.0"
embedded-io-async = "0.7.0"
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112", default-features = false }
embedded-partitions = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }

# block-device-adapters/driver を embedded-fatfs と同じ git rev へ揃える
# （crates.io 版は embedded-io-async のバージョンがズレてトレイト不整合になる）。
[patch.crates-io]
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }

# embassy-debug の release-fw 相当（サイズ最適化＋fat LTO）。
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
