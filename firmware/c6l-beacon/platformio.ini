; Nostos C6L ビーコン（生 LoRa 分報送信）— PlatformIO / Arduino / RadioLib
; ⚠️ 送信 RF は技適の認証枠に固定（docs/COMPLIANCE.md）。ここや src/main.cpp の
;    周波数・帯域・出力を認証枠外に変更しないこと。
;
; ⚠️ ESP32-C6 + Arduino: 公式 platform-espressif32 が C6/arduino 未対応の場合は
;    pioarduino フォークを使う（下の platform 行を差し替え）。

[env:c6l-beacon]
; ESP32-C6 + Arduino には pioarduino フォークが必要（公式 espressif32 の arduino は
; 2.0.17 で C6 非対応＝"This board doesn't support arduino framework!"）。
; 最新版は https://github.com/pioarduino/platform-espressif32/releases で確認。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; USB-Serial/JTAG を Serial に（variant と同じ・シリアルログ用）
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  jgromes/RadioLib@^7.1.0
  mikalhart/TinyGPSPlus@^1.1.0

; フラッシュ前に必ず C6L をバックアップ済みであること
; （backups/c6l-meshtastic-original-*.bin / espflash write-flash 0 <bin> で復元）

; ---- E2E 検証専用ビルド（屋内で GPS fix 不能なとき）----
; 実 GPS を無視し、送信 seq に応じた合成トラック（約70m/送信・北東）を fix=1 で送る。
; RF（周波数/帯域/出力/sync）は本番と完全同一＝技適に無関係。検証後は env:c6l-beacon に戻す。
;   pio run -e c6l-beacon-dummy -t upload --upload-port COM7
[env:c6l-beacon-dummy]
extends = env:c6l-beacon
build_flags =
  ${env:c6l-beacon.build_flags}
  -DDUMMY_GPS=1
