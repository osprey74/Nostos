; Nostos C6L ビーコン（生 LoRa 分報送信）— PlatformIO / Arduino / RadioLib
; ⚠️ 送信 RF は技適の認証枠に固定（docs/COMPLIANCE.md）。ここや src/main.cpp の
;    周波数・帯域・出力を認証枠外に変更しないこと。
;
; ⚠️ ESP32-C6 + Arduino: 公式 platform-espressif32 が C6/arduino 未対応の場合は
;    pioarduino フォークを使う（下の platform 行を差し替え）。

[env:c6l-beacon]
; 公式が C6+arduino 対応済みならこちら:
platform = espressif32
; 未対応なら↓に差し替え（pioarduino）:
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/latest/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; USB-Serial/JTAG を Serial に（variant と同じ・シリアルログ用）
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  jgromes/RadioLib@^7.1.0
  mikalhart/TinyGPSPlus@^1.1.0

; フラッシュ前に必ず C6L をバックアップ済みであること
; （backups/c6l-meshtastic-original-*.bin / espflash write-flash 0 <bin> で復元）
